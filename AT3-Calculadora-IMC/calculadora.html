<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

    <main class="container py-5">
        <h1 class="text-center mb-4 text-secondary">Calcule seu IMC</h1>
        
        <div class="card mx-auto shadow-sm border-0" style="max-width: 400px;">
            <div class="card-body p-4">
                <div class="mb-3">
                    <label for="peso" class="form-label fw-bold">Peso (kg)</label>
                    <input type="text" id="peso" class="form-control form-control-lg" placeholder="Ex: 70,5">
                </div>

                <div class="mb-4">
                    <label for="altura" class="form-label fw-bold">Altura (m)</label>
                    <input type="text" id="altura" class="form-control form-control-lg" placeholder="Ex: 1,75">
                </div>

                <button type="button" class="btn btn-primary btn-lg w-100 fw-bold" onclick="calcularIMC()">Calcular</button>

                <div id="resultado" class="d-none mt-4 text-center mb-0"></div>
            </div>
        </div>

        <div class="mt-5 mx-auto" style="max-width: 600px;">
            <h4 class="text-center mb-3 text-secondary">Tabela de Resultados para Adultos</h4>
            <div class="table-responsive shadow-sm rounded">
                <table class="table table-hover table-bordered table-white mb-0 align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>IMC</th>
                            <th>Classificação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Menor que 18,5</td>
                            <td>Baixo peso</td>
                        </tr>
                        <tr>
                            <td>18,5 a 24,9</td>
                            <td>Peso normal</td>
                        </tr>
                        <tr>
                            <td>25 a 29,9</td>
                            <td>Sobrepeso</td>
                        </tr>
                        <tr>
                            <td>30 a 34,9</td>
                            <td>Obesidade grau I</td>
                        </tr>
                        <tr>
                            <td>35 a 39,9</td>
                            <td>Obesidade grau II</td>
                        </tr>
                        <tr>
                            <td>40 ou mais</td>
                            <td>Obesidade grau III (mórbida)</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        function calcularIMC() {
            let pesoInput = document.getElementById("peso").value.replace(",", ".");
            let alturaInput = document.getElementById("altura").value.replace(",", ".");

            let peso = parseFloat(pesoInput);
            let altura = parseFloat(alturaInput);
            let divResultado = document.getElementById("resultado");

            if (!peso || !altura || peso <= 0 || altura <= 0) {
                divResultado.className = "alert alert-danger mt-4 text-center mb-0";
                divResultado.innerHTML = "Por favor, preencha o peso e a altura corretamente.";
                return;
            }

            let imc = peso / (altura * altura);
            
            let classificacao = "";
            let corAlerta = "";

            if (imc < 18.5) {
                classificacao = "Baixo peso";
                corAlerta = "alert-info";
            } else if (imc < 25) {
                classificacao = "Peso normal";
                corAlerta = "alert-success";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
                corAlerta = "alert-warning";
            } else if (imc < 35) {
                classificacao = "Obesidade grau I";
                corAlerta = "alert-warning";
            } else if (imc < 40) {
                classificacao = "Obesidade grau II";
                corAlerta = "alert-danger";
            } else {
                classificacao = "Obesidade grau III (mórbida)";
                corAlerta = "alert-danger";
            }

            let imcFormatado = imc.toFixed(2).replace(".", ",");

            divResultado.className = `alert ${corAlerta} mt-4 text-center mb-0`;
            divResultado.innerHTML = `<span class="d-block fs-5 mb-1"><strong>Seu IMC:</strong> ${imcFormatado} kg/m²</span> <strong>Classificação:</strong> ${classificacao}`;
        }
    </script>
</body>
</html>
